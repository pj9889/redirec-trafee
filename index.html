<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <link rel="icon" type="image/webp" href="locantof1.webp">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #000;
        }
        .bg-slider {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .bg-slide {
            position: absolute;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }
        .bg-slide.active {
            opacity: 1;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 2;
        }
        .content-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            padding: 20px 10px;
        }
        
        .top-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 5px;
        }

        .logo-container {
            width: 100%;
            max-width: 450px;
            margin-bottom: 5px;
            padding: 0 15px;
        }
        .logo-container img {
            width: 100%;
            height: auto;
            display: block;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.5));
        }
        
        /* Powered by Locanto স্টাইল */
        .powered-by {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.9);
            margin-top: 5px;
            font-weight: 600;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        
        /* Locanto কালার ক্লাসেস */
        .locanto-text {
            font-weight: 800;
            font-style: italic;
        }
        .lo-dark-blue { color: #1d4fa4; }
        .can-vibrant-orange { color: #f26522; }
        .to-reddish-orange { color: #c64416; }

        /* বাটনের ঠিক উপরের সেকশন (টেক্সটসমূহ) */
        .bottom-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 10px;
        }

        .text-line {
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            line-height: 1.1;
            margin: 2px 0;
            opacity: 0;
        }
        .text-many-holes {
            font-size: clamp(2.2rem, 6vw, 3.8rem);
            color: #fff;
            text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055;
        }
        .slide-from-left {
            animation: slideLeft 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .text-waiting {
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
        }
        .slide-from-right {
            animation: slideRight 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .text-free {
            font-size: clamp(2.5rem, 7vw, 4.5rem);
            color: #39ff14;
            text-shadow: 0 0 15px #39ff14, 0 0 30px #39ff14;
            margin-bottom: 12px; /* বাটনের সাথে গ্যাপ */
        }
        .slide-from-bottom {
            animation: slideBottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, 
                       megaShake 0.15s infinite alternate linear;
            animation-delay: 0s, 0.4s;
        }

        /* ------------------ ৩টি বাটন কন্টেইনার ------------------ */
        .buttons-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .cta-button {
            display: block;
            width: 100%;
            text-decoration: none;
            padding: 13px 20px;
            font-size: clamp(1.1rem, 3.8vw, 1.35rem);
            font-weight: 900;
            text-transform: uppercase;
            border-radius: 50px;
            cursor: pointer;
            border: none;
            outline: none;
            position: relative;
            z-index: 10;
            text-align: center;
            transition: all 0.2s ease-in-out;
        }

        /* ১. Website Button - Yellow Glow */
        .btn-website {
            color: #000;
            background: linear-gradient(90deg, #ffea00 0%, #ffcc00 100%);
            box-shadow: 0 0 15px #ffcc00, inset 0 0 8px rgba(255,255,255,0.6);
            animation: pulseNudge 1.5s infinite ease-in-out;
        }

        /* ২. Telegram Button - Sky Blue Glow */
        .btn-telegram {
            color: #fff;
            background: linear-gradient(90deg, #0088cc 0%, #00bcff 100%);
            box-shadow: 0 0 15px #00bcff, inset 0 0 8px rgba(255,255,255,0.4);
            animation: pulseTelegram 1.5s infinite ease-in-out;
        }

        /* ৩. WhatsApp Button - Vibrant Green Glow */
        .btn-whatsapp {
            color: #fff;
            background: linear-gradient(90deg, #25d366 0%, #075e54 100%);
            box-shadow: 0 0 15px #25d366, inset 0 0 8px rgba(255,255,255,0.4);
            animation: pulseWhatsApp 1.5s infinite ease-in-out;
        }

        /* ------------------ রিয়েল ক্লিক ইফেক্ট ক্লাসেস (বিপরীত কালার) ------------------ */
        .cta-button.btn-clicked {
            animation: none !important;
            transform: scale(0.95) !important;
            pointer-events: none;
        }

        .btn-website.btn-clicked {
            background: linear-gradient(90deg, #d50000 0%, #ff1744 100%) !important;
            color: #fff !important;
            box-shadow: 0 0 25px #ff1744 !important;
        }

        .btn-telegram.btn-clicked {
            background: linear-gradient(90deg, #ff6d00 0%, #ff9100 100%) !important;
            color: #fff !important;
            box-shadow: 0 0 25px #ff9100 !important;
        }

        .btn-whatsapp.btn-clicked {
            background: linear-gradient(90deg, #c51162 0%, #f50057 100%) !important;
            color: #fff !important;
            box-shadow: 0 0 25px #f50057 !important;
        }

        /* অ্যানিমেশনসমূহ */
        @keyframes slideLeft {
            0% { transform: translateX(-150%) skewX(-20deg); opacity: 0; }
            100% { transform: translateX(0) skewX(0deg); opacity: 1; }
        }
        @keyframes slideRight {
            0% { transform: translateX(150%) skewX(20deg); opacity: 0; }
            100% { transform: translateX(0) skewX(0deg); opacity: 1; }
        }
        @keyframes slideBottom {
            0% { transform: translateY(150%) scale(0.5); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        @keyframes megaShake {
            0% { transform: translate(2px, 1px) rotate(0deg) scale(1); }
            20% { transform: translate(-1px, -2px) rotate(-1deg) scale(1.03); }
            40% { transform: translate(-2px, 0px) rotate(1deg) scale(1); }
            60% { transform: translate(0px, 2px) rotate(0deg) scale(1.03); }
            80% { transform: translate(1px, -1px) rotate(-1deg) scale(1); }
            100% { transform: translate(-1px, 2px) rotate(1deg) scale(1.05); }
        }
        
        /* বাটন পালস অ্যানিমেশনসমূহ */
        @keyframes pulseNudge {
            0%, 100% { transform: scale(1); box-shadow: 0 0 15px #ffcc00; }
            50% { transform: scale(1.03); box-shadow: 0 0 25px #ffea00; }
        }
        @keyframes pulseTelegram {
            0%, 100% { transform: scale(1); box-shadow: 0 0 15px #00bcff; }
            50% { transform: scale(1.03); box-shadow: 0 0 25px #0088cc; }
        }
        @keyframes pulseWhatsApp {
            0%, 100% { transform: scale(1); box-shadow: 0 0 15px #25d366; }
            50% { transform: scale(1.03); box-shadow: 0 0 25px #34ea78; }
        }
    </style>
</head>
<body>

    <div class="bg-slider">
        <div class="bg-slide active" style="background-image: url('ki1.webp');"></div>
        <div class="bg-slide" style="background-image: url('ki2.webp');"></div>
        <div class="bg-slide" style="background-image: url('ki3.webp');"></div>
        <div class="bg-slide" style="background-image: url('ki4.webp');"></div>
        <div class="bg-slide" style="background-image: url('ki5.webp');"></div>
    </div>

    <div class="overlay"></div>

    <div class="content-container">
        <!-- ১. উপরে শুধু লোগো সেকশন -->
        <div class="top-section">
            <div class="logo-container">
                <img src="lgd1.webp" alt="Logo">
                <div class="powered-by">
                    Powered by 
                    <span class="locanto-text">
                        <span class="lo-dark-blue">L</span><span class="lo-dark-blue">o</span><span class="can-vibrant-orange">c</span><span class="can-vibrant-orange">a</span><span class="can-vibrant-orange">n</span><span class="to-reddish-orange">t</span><span class="to-reddish-orange">o</span>
                    </span>
                </div>
            </div>
        </div>

        <!-- ২. নিচে টেক্সট এবং তার ঠিক নিচে ৩টি বাটন -->
        <div class="bottom-section">
            <!-- হেডিং টেক্সটসমূহ (এখন বাটনের ঠিক উপরে) -->
            <h1 id="text1" class="text-line text-many-holes">Many Holes</h1>
            <h2 id="text2" class="text-line text-waiting">Waiting For You</h2>
            <div id="text3" class="text-line text-free">Free</div>

            <!-- ৩টি বাটন -->
            <div class="buttons-container">
                <!-- ১. ওয়েবসাইট বাটন (এখানে ৫টি লিংক রোটেশন হবে) -->
                <button id="websiteBtn" class="cta-button btn-website">Visit Website For Fuck</button>
                
                <!-- ২. টেলিগ্রাম বাটন -->
                <a id="telegramBtn" href="t.me/ninakw247" target="_blank" class="cta-button btn-telegram">Visit Telegram</a>
                
                <!-- ৩. হোয়াটসঅ্যাপ বাটন -->
                <a id="whatsappBtn" href="https://whatsapp.com/channel/0029VbDQky7LikgCKpSj7t2i" target="_blank" class="cta-button btn-whatsapp">Visit WhatsApp</a>
            </div>
        </div>
    </div>

    <script>
        // ৫টি অ্যাফিলিয়েট লিংকের অ্যারে
        const affiliateLinks = [
            "https://paysale.g2afse.com/click?pid=125904&offer_id=10417",
            "https://paysale.g2afse.com/click?pid=125904&offer_id=10401",
            "https://paysale.g2afse.com/click?pid=125904&offer_id=10199",
            "https://paysale.g2afse.com/click?pid=125904&offer_id=7684",
            "https://paysale.g2afse.com/click?pid=125904&offer_id=12982"
        ];

        // ব্যাকগ্রাউন্ড স্লাইডার
        const slides = document.querySelectorAll('.bg-slide');
        let currentSlide = 0;

        setInterval(() => {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }, 1000);

        // পেজ লোড ও অ্যানিমেশন হ্যান্ডলিং
        window.addEventListener('load', () => {
            const t1 = document.getElementById('text1');
            const t2 = document.getElementById('text2');
            const t3 = document.getElementById('text3');
            
            const webBtn = document.getElementById('websiteBtn');
            const tgBtn = document.getElementById('telegramBtn');
            const waBtn = document.getElementById('whatsappBtn');

            t1.classList.add('slide-from-left');

            setTimeout(() => {
                t2.classList.add('slide-from-right');
            }, 300);

            setTimeout(() => {
                t3.classList.add('slide-from-bottom');
            }, 600);

            // ১. ওয়েবসাইট বাটন ক্লিক হ্যান্ডলার (Rotate 5 Links + 1 sec delay color change)
            webBtn.addEventListener('click', (e) => {
                e.preventDefault();
                webBtn.classList.add('btn-clicked');

                let currentIndex = parseInt(localStorage.getItem('currentOfferIndex')) || 0;
                const targetLink = affiliateLinks[currentIndex];

                let nextIndex = (currentIndex + 1) % affiliateLinks.length;
                localStorage.setItem('currentOfferIndex', nextIndex);

                setTimeout(() => {
                    window.location.href = targetLink;
                }, 1000);
            });

            // ২. টেলিগ্রাম বাটন ক্লিক হ্যান্ডলার (1 sec delay color change)
            tgBtn.addEventListener('click', (e) => {
                e.preventDefault();
                tgBtn.classList.add('btn-clicked');
                const targetLink = tgBtn.getAttribute('href');

                setTimeout(() => {
                    window.open(targetLink, '_blank');
                }, 1000);
            });

            // ৩. হোয়াটসঅ্যাপ বাটন ক্লিক হ্যান্ডলার (1 sec delay color change)
            waBtn.addEventListener('click', (e) => {
                e.preventDefault();
                waBtn.classList.add('btn-clicked');
                const targetLink = waBtn.getAttribute('href');

                setTimeout(() => {
                    window.open(targetLink, '_blank');
                }, 1000);
            });
        });
    </script>
</body>
</html>
